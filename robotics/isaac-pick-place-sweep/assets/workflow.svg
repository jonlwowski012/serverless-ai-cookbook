<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1840 880" font-family="Arial"><defs><marker id="arwN" markerWidth="12" markerHeight="12" refX="9" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="#12263A"/></marker><marker id="arwG" markerWidth="12" markerHeight="12" refX="9" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="#A6CE3A"/></marker></defs><rect width="1840" height="880" fill="#FFFFFF"/><rect x="55" y="34" width="11" height="46" fill="#A6CE3A"/><text x="82" y="70" font-family="Georgia,serif" font-size="40" font-weight="bold" fill="#12263A">Isaac Sim pick-and-place sweep on Nebius Serverless</text><text x="84" y="108" font-family="Arial" font-size="20" fill="#56657A">Build one image locally; submit one independent GPU job for every pickup X × placement Y combination.</text><text x="40" y="210" font-family="Arial" font-size="14" font-weight="bold" fill="#56657A">YOUR MACHINE</text><text x="780" y="210" font-family="Arial" font-size="14" font-weight="bold" fill="#56657A">NEBIUS AI CLOUD</text><text x="1490" y="210" font-family="Arial" font-size="14" font-weight="bold" fill="#56657A">YOUR MACHINE</text><rect x="40" y="270" width="290" height="155" rx="14" fill="#D7E3F2" stroke="#9DB8D6" stroke-width="2.6"/><text x="185.0" y="329.5" text-anchor="middle" font-family="Arial" font-size="21" font-weight="bold" fill="#12263A">Container + sweep.json</text><text x="185.0" y="354.5" text-anchor="middle" font-family="Arial" font-size="16" fill="#12263A">Build, push and inspect requests</text><text x="185.0" y="379.5" text-anchor="middle" font-family="Arial" font-size="16" font-style="italic" font-weight="bold" fill="#2A4B6E">Step 1 · configure</text><rect x="390" y="270" width="320" height="155" rx="14" fill="#D7E3F2" stroke="#9DB8D6" stroke-width="2.6"/><text x="550.0" y="329.5" text-anchor="middle" font-family="Arial" font-size="21" font-weight="bold" fill="#12263A">launch.py</text><text x="550.0" y="354.5" text-anchor="middle" font-family="Arial" font-size="16" fill="#12263A">2 pickup X × 2 placement Y</text><text x="550.0" y="379.5" text-anchor="middle" font-family="Arial" font-size="16" font-style="italic" font-weight="bold" fill="#2A4B6E">Step 2 · submit asynchronously</text><rect x="790" y="240" width="280" height="70" rx="14" fill="#12263A" stroke="#12263A" stroke-width="2.6"/><text x="930.0" y="269.5" text-anchor="middle" font-family="Arial" font-size="21" font-weight="bold" fill="#FFFFFF">GPU job · case-000</text><text x="930.0" y="294.5" text-anchor="middle" font-family="Arial" font-size="16" fill="#FFFFFF">One L40S + Isaac Sim</text><rect x="790" y="330" width="280" height="70" rx="14" fill="#12263A" stroke="#12263A" stroke-width="2.6"/><text x="930.0" y="359.5" text-anchor="middle" font-family="Arial" font-size="21" font-weight="bold" fill="#FFFFFF">GPU job · case-001</text><text x="930.0" y="384.5" text-anchor="middle" font-family="Arial" font-size="16" fill="#FFFFFF">One L40S + Isaac Sim</text><rect x="790" y="420" width="280" height="70" rx="14" fill="#12263A" stroke="#12263A" stroke-width="2.6"/><text x="930.0" y="449.5" text-anchor="middle" font-family="Arial" font-size="21" font-weight="bold" fill="#FFFFFF">GPU job · case-002</text><text x="930.0" y="474.5" text-anchor="middle" font-family="Arial" font-size="16" fill="#FFFFFF">One L40S + Isaac Sim</text><rect x="790" y="510" width="280" height="70" rx="14" fill="#12263A" stroke="#12263A" stroke-width="2.6"/><text x="930.0" y="539.5" text-anchor="middle" font-family="Arial" font-size="21" font-weight="bold" fill="#FFFFFF">GPU job · case-003</text><text x="930.0" y="564.5" text-anchor="middle" font-family="Arial" font-size="16" fill="#FFFFFF">One L40S + Isaac Sim</text><path d="M1150,344.8 A135.0,19.8 0 0 1 1420,344.8 L1420,485.2 A135.0,19.8 0 0 1 1150,485.2 Z" fill="#12263A" stroke="#12263A" stroke-width="2.6"/><path d="M1150,344.8 A135.0,19.8 0 0 0 1420,344.8" fill="none" stroke="#12263A" stroke-width="2.6"/><text x="1285.0" y="402.0" text-anchor="middle" font-family="Arial" font-size="21" font-weight="bold" fill="#FFFFFF">Object Storage</text><text x="1285.0" y="427.0" text-anchor="middle" font-family="Arial" font-size="16" fill="#FFFFFF">result.json + COMPLETE</text><text x="1285.0" y="452.0" text-anchor="middle" font-family="Arial" font-size="16" fill="#FFFFFF">Optional trajectory.json</text><rect x="1490" y="335" width="310" height="155" rx="14" fill="#D7E3F2" stroke="#9DB8D6" stroke-width="2.6"/><text x="1645.0" y="394.5" text-anchor="middle" font-family="Arial" font-size="21" font-weight="bold" fill="#12263A">Download and verify</text><text x="1645.0" y="419.5" text-anchor="middle" font-family="Arial" font-size="16" fill="#12263A">Check results; replay in Rerun</text><text x="1645.0" y="444.5" text-anchor="middle" font-family="Arial" font-size="16" font-style="italic" font-weight="bold" fill="#2A4B6E">Step 3 · compare cases</text><polyline points="330,345 390,345" fill="none" stroke="#12263A" stroke-width="2.8" marker-end="url(#arwN)"/><polyline points="710,345 750,345 750,275 790,275" fill="none" stroke="#12263A" stroke-width="2.8" marker-end="url(#arwN)"/><polyline points="1070,275 1110,275 1110,415 1150,415" fill="none" stroke="#12263A" stroke-width="2.8" marker-end="url(#arwN)"/><polyline points="710,345 750,345 750,365 790,365" fill="none" stroke="#12263A" stroke-width="2.8" marker-end="url(#arwN)"/><polyline points="1070,365 1110,365 1110,415 1150,415" fill="none" stroke="#12263A" stroke-width="2.8" marker-end="url(#arwN)"/><polyline points="710,345 750,345 750,455 790,455" fill="none" stroke="#12263A" stroke-width="2.8" marker-end="url(#arwN)"/><polyline points="1070,455 1110,455 1110,415 1150,415" fill="none" stroke="#12263A" stroke-width="2.8" marker-end="url(#arwN)"/><polyline points="710,345 750,345 750,545 790,545" fill="none" stroke="#12263A" stroke-width="2.8" marker-end="url(#arwN)"/><polyline points="1070,545 1110,545 1110,415 1150,415" fill="none" stroke="#12263A" stroke-width="2.8" marker-end="url(#arwN)"/><polyline points="1420,415 1490,415" fill="none" stroke="#12263A" stroke-width="2.8" marker-end="url(#arwN)"/><rect x="40" y="625" width="1760" height="85" rx="12" fill="#EEF2F7" stroke="#12263A" stroke-width="1.6"/><rect x="60" y="643" width="12" height="12" fill="#A6CE3A"/><text x="80" y="655" font-family="Arial" font-size="18" font-weight="bold" fill="#12263A">Execution boundary</text><text x="60" y="687" font-family="Arial" font-size="15.5" fill="#243541">Isaac Sim runs in each cloud job. Rerun runs locally and visualizes recorded poses; no cloud viewer or model training is needed.</text><text x="45" y="736" font-family="Arial" font-size="18" font-weight="bold" fill="#12263A">Color key</text><rect x="45" y="750" width="44" height="30" rx="6" fill="#D7E3F2" stroke="#9DB8D6" stroke-width="2.5"/><text x="103" y="771" font-family="Arial" font-size="16" fill="#243541">Your machine</text><rect x="45" y="796" width="44" height="30" rx="6" fill="#12263A" stroke="#12263A" stroke-width="2.5"/><text x="103" y="817" font-family="Arial" font-size="16" fill="#243541">Nebius infrastructure</text></svg>