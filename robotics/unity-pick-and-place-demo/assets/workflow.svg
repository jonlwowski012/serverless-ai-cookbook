<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1840 730" font-family="Arial"><defs><marker id="arwN" markerWidth="12" markerHeight="12" refX="9" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="#12263A"/></marker><marker id="arwG" markerWidth="12" markerHeight="12" refX="9" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="#A6CE3A"/></marker></defs><rect width="1840" height="730" fill="#FFFFFF"/><rect x="55" y="34" width="11" height="46" fill="#A6CE3A"/><text x="82" y="70" font-family="Georgia,serif" font-size="40" font-weight="bold" fill="#12263A">Unity UR3 pick-and-place on Nebius Serverless</text><text x="84" y="108" font-family="Arial" font-size="20" fill="#56657A">Build the Linux player locally; run physics, rendering, ROS 2, and the shipped controller in one GPU job.</text><text x="40" y="210" font-family="Arial" font-size="14" font-weight="bold" fill="#56657A">LOCAL BUILD</text><text x="385" y="210" font-family="Arial" font-size="14" font-weight="bold" fill="#56657A">NEBIUS AI CLOUD</text><text x="1470" y="210" font-family="Arial" font-size="14" font-weight="bold" fill="#56657A">LOCAL VERIFICATION</text><rect x="40" y="270" width="290" height="155" rx="14" fill="#D7E3F2" stroke="#9DB8D6" stroke-width="2.6"/><text x="185.0" y="329.5" text-anchor="middle" font-family="Arial" font-size="21" font-weight="bold" fill="#12263A">Unity Linux player</text><text x="185.0" y="354.5" text-anchor="middle" font-family="Arial" font-size="16" fill="#12263A">Licensed Editor + pinned project</text><text x="185.0" y="379.5" text-anchor="middle" font-family="Arial" font-size="16" font-style="italic" font-weight="bold" fill="#2A4B6E">Step 1 · prepare and build</text><rect x="385" y="270" width="290" height="155" rx="14" fill="#12263A" stroke="#12263A" stroke-width="2.6"/><text x="530.0" y="329.5" text-anchor="middle" font-family="Arial" font-size="21" font-weight="bold" fill="#FFFFFF">Container Registry</text><text x="530.0" y="354.5" text-anchor="middle" font-family="Arial" font-size="16" fill="#FFFFFF">Player + ROS 2 + shipped model</text><text x="530.0" y="379.5" text-anchor="middle" font-family="Arial" font-size="16" font-style="italic" font-weight="bold" fill="#A6CE3A">Step 2 · build and push</text><rect x="730" y="250" width="350" height="195" rx="14" fill="#12263A" stroke="#12263A" stroke-width="2.6"/><text x="905.0" y="317.0" text-anchor="middle" font-family="Arial" font-size="21" font-weight="bold" fill="#FFFFFF">Serverless GPU job</text><text x="905.0" y="342.0" text-anchor="middle" font-family="Arial" font-size="16" fill="#FFFFFF">Unity physics + NVIDIA rendering</text><text x="905.0" y="367.0" text-anchor="middle" font-family="Arial" font-size="16" fill="#FFFFFF">ROS 2 + learned joint servo</text><text x="905.0" y="392.0" text-anchor="middle" font-family="Arial" font-size="16" font-style="italic" font-weight="bold" fill="#A6CE3A">Step 3 · run on one L40S</text><path d="M1140,279.25 A135.0,19.25 0 0 1 1410,279.25 L1410,415.75 A135.0,19.25 0 0 1 1140,415.75 Z" fill="#12263A" stroke="#12263A" stroke-width="2.6"/><path d="M1140,279.25 A135.0,19.25 0 0 0 1410,279.25" fill="none" stroke="#12263A" stroke-width="2.6"/><text x="1275.0" y="334.5" text-anchor="middle" font-family="Arial" font-size="21" font-weight="bold" fill="#FFFFFF">Object Storage</text><text x="1275.0" y="359.5" text-anchor="middle" font-family="Arial" font-size="16" fill="#FFFFFF">Video, ROS bag, trajectories</text><text x="1275.0" y="384.5" text-anchor="middle" font-family="Arial" font-size="16" fill="#FFFFFF">Checked result.json</text><rect x="1470" y="270" width="330" height="155" rx="14" fill="#D7E3F2" stroke="#9DB8D6" stroke-width="2.6"/><text x="1635.0" y="329.5" text-anchor="middle" font-family="Arial" font-size="21" font-weight="bold" fill="#12263A">Download and check</text><text x="1635.0" y="354.5" text-anchor="middle" font-family="Arial" font-size="16" fill="#12263A">Validate artifacts; watch video</text><text x="1635.0" y="379.5" text-anchor="middle" font-family="Arial" font-size="16" font-style="italic" font-weight="bold" fill="#2A4B6E">Step 4 · verify result</text><polyline points="330,345 385,345" fill="none" stroke="#12263A" stroke-width="2.8" marker-end="url(#arwN)"/><polyline points="675,345 730,345" fill="none" stroke="#12263A" stroke-width="2.8" marker-end="url(#arwN)"/><polyline points="1080,345 1140,345" fill="none" stroke="#12263A" stroke-width="2.8" marker-end="url(#arwN)"/><polyline points="1410,345 1470,345" fill="none" stroke="#12263A" stroke-width="2.8" marker-end="url(#arwN)"/><rect x="40" y="475" width="1760" height="90" rx="12" fill="#EEF2F7" stroke="#12263A" stroke-width="1.6"/><rect x="60" y="493" width="12" height="12" fill="#A6CE3A"/><text x="80" y="505" font-family="Arial" font-size="18" font-weight="bold" fill="#12263A">Execution boundary</text><text x="60" y="537" font-family="Arial" font-size="15.5" fill="#243541">The licensed Editor stays on your machine. The GPU job runs the built player; no model training or public ROS endpoint is required.</text><text x="45" y="596" font-family="Arial" font-size="18" font-weight="bold" fill="#12263A">Color key</text><rect x="45" y="610" width="44" height="30" rx="6" fill="#D7E3F2" stroke="#9DB8D6" stroke-width="2.5"/><text x="103" y="631" font-family="Arial" font-size="16" fill="#243541">Your machine</text><rect x="45" y="656" width="44" height="30" rx="6" fill="#12263A" stroke="#12263A" stroke-width="2.5"/><text x="103" y="677" font-family="Arial" font-size="16" fill="#243541">Nebius infrastructure</text></svg>